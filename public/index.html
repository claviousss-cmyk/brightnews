.brandtxt{color:var(--b)}

.bg-slate-800{background:var(--bl)!important;color:#0b3a7a}
.bg-slate-950\/60{background:#f1f6ff!important}

.text-slate-400,.text-slate-500{color:#5b7196!important}
.text-blue-400,.text-cyan-400,.text-blue-300{color:var(--b)!important}
.text-emerald-400{color:#059669!important}.text-red-400{color:#dc2626!important}.text-orange-400{color:#c2410c!important}.text-amber-300{color:#b45309!important}
.bg-blue-600,.bg-cyan-400{background:var(--b)!important;color:#fff!important}

.hero-anim .text-slate-100,.hero-anim .text-slate-200,.hero-anim .text-slate-300,.hero-anim .text-slate-400,.hero-anim .text-blue-400,.hero-anim .text-cyan-400,.hero-anim .text-blue-300{color:#dbeaff!important}
.hero-anim [class*="bg-slate-900"]{background:rgba(255,255,255,.15)!important;box-shadow:none}

#app h2{display:flex;align-items:center;gap:10px}#app h2::before{content:"";width:4px;height:1.1em;background:var(--b);border-radius:2px}
.ico{display:inline-block;vertical-align:middle}.ico.g{width:14px;height:14px;border-radius:50%;background:var(--b);border:2px solid #fff;box-shadow:0 0 0 1px var(--b)}.ico.y,.ico.r{width:10px;height:14px;border-radius:2px;background:#facc15}.ico.r{background:#ef4444}
.livebadge::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#ef4444;margin-right:6px;animation:blink 1s infinite}
.soc{display:inline-flex;width:42px;height:42px;border-radius:50%;align-items:center;justify-content:center;background:var(--bl);color:var(--b);transition:.25s}.soc:hover{background:var(--b);color:#fff;transform:translateY(-3px)}
.orbit{position:absolute;right:-90px;top:-90px;width:520px;max-width:85%;pointer-events:none}.orbit g{transform-box:view-box;transform-origin:200px 200px}
.o1{animation:spin 26s linear infinite}.o2{animation:spin 38s linear infinite reverse}.o3{animation:spin 60s linear infinite}.core{animation:corep 4s ease-in-out infinite;transform-origin:200px 200px;transform-box:view-box}
.ticker{overflow:hidden;margin-top:14px;border-radius:14px;background:var(--b);color:#fff;padding:11px 0}.tk-in{display:flex;width:max-content;animation:marquee 45s linear infinite}.ticker:hover .tk-in{animation-play-state:paused}.tk{padding:0 28px;font-size:12px;white-space:nowrap;border-right:1px solid rgba(255,255,255,.3)}
.rise{opacity:0;transform:translateY(26px);animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--d,0s)}
.noanim .rise{animation:none;opacity:1;transform:none}
.reveal{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s ease}.reveal.in{opacity:1;transform:none}
.sheen{position:relative;overflow:hidden}.sheen::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(0,87,184,.25),transparent);animation:sheen 3.2s ease-in-out infinite}
#app:not(.noanim)>section,#app:not(.noanim)>div:not(.reveal):not(.grid){animation:fadeUp .6s ease both}
#app:not(.noanim) .hero-anim{animation:fadeUp .6s ease both,gradMove 12s ease infinite}

#app:not(.noanim) :not(.reveal)>.grid>div:nth-child(3n+2){animation-delay:.07s}#app:not(.noanim) :not(.reveal)>.grid>div:nth-child(3n){animation-delay:.14s}
.grid>div{transition:transform .25s,box-shadow .25s}.grid>div:hover{transform:translateY(-4px);box-shadow:0 16px 36px -14px rgba(0,87,184,.45)}
.ring-red-500\/60{animation:livepulse 1.8s infinite}
.bar{animation:grow .9s ease both}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

@keyframes gradMove{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
@keyframes livepulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}50%{box-shadow:0 0 0 9px rgba(239,68,68,0)}}
@keyframes grow{from{width:0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes blink{50%{opacity:.25}}
@keyframes marquee{to{transform:translateX(-50%)}}@keyframes sheen{0%{left:-60%}60%,100%{left:130%}}@keyframes corep{50%{transform:scale(1.25)}}
.skel{background:linear-gradient(90deg,#e8f1ff 25%,#f6faff 50%,#e8f1ff 75%);background-size:200% 100%;animation:shim 1.3s infinite}
html.night .skel{background:linear-gradient(90deg,rgba(0,87,184,.2) 25%,rgba(0,87,184,.38) 50%,rgba(0,87,184,.2) 75%);background-size:200% 100%}
@keyframes shim{to{background-position:-200% 0}}
.logo{display:inline-flex;width:40px;height:40px;border-radius:12px;align-items:center;justify-content:center;background:var(--b);color:#fff;font-weight:800;font-size:15px;box-shadow:0 6px 16px -6px rgba(0,87,184,.7)}
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid #dbe7fb;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:700;color:#5b7196;padding:6px 0}
#tabbar button.on{color:var(--b)}#tabbar svg{width:22px;height:22px}
html.night #tabbar{background:rgba(6,20,46,.95);border-color:rgba(120,170,255,.25)}html.night #tabbar button{color:#9db8e3}html.night #tabbar button.on{color:#7db8ff}
@media(min-width:768px){#tabbar,#more{display:none!important}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.3s}

<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COMPS = { PL:'Premier League', PD:'La Liga', SA:'Drawe A', BL1:'Bundesliga', FL1:'Ligue 1', CL:'Champions League' };
let S = { q:'', fq:0, league:'ALL', h2h:null, pos:null, view:'home', filter:'ALL', comp:'PL', matches:[], err:null, detailId:null, detail:null, detailErr:null, std:null };

const kind = m => ['IN_PLAY','PAUSED'].includes(m.status) ? 'LIVE' : m.status === 'FINISHED' ? 'FT' : (['POSTPONED','CANCELLED','SUSPENDED','AWARDED'].includes(m.status) || Date.parse(m.utcDate) < Date.now() - 3 * 3600e3) ? 'PP' : 'UP';
const fmtTime = d => new Date(d).toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
const fmtDate = d => new Date(d).toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
const crest = u => u ? `<img src="${esc(u)}" class="w-7 h-7 object-contain" alt="">` : '<span class="w-7 h-7"></span>';

async function api(url) {
  const r = await fetch(url, S.token ? { headers: { 'x-token': S.token } } : undefined);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);
  return j;
}

// ============ MATCHES ============
async function loadMatches() {
  try { S.matches = (await api('/api/matches')).matches || []; S.err = null; }
  catch (e) { S.err = e.message; }
  S.loaded = true;
  if (['home','matches'].includes(S.view) && !S.detailId) qr();
}

function badge(m) {
  const k = kind(m);
  if (k === 'LIVE') return `<span class="px-2 py-0.5 rounded bg-red-500/20 text-red-400 livebadge">LIVE ${minuteOf(m)}</span>`;
  if (k === 'PP') return '<span class="px-2 py-0.5 rounded bg-amber-500/20 text-amber-300"> ' + (m.status === 'POSTPONED' ? 'Postponed' : 'Awaiting update') + '</span>';
  if (k === 'FT') return '<span class="px-2 py-0.5 rounded bg-slate-800 text-slate-300">FT</span>';
  return `<span class="px-2 py-0.5 rounded bg-blue-500/20 text-blue-300">${gmt(m.utcDate)} GMT</span>`;
}

function card(m) {
  const h = m.score?.fullTime?.home, a = m.score?.fullTime?.away;
  const show = ['LIVE', 'FT'].includes(kind(m));
  return `<div onclick="openMatch(${m.id})" class="cursor-pointer p-5 rounded-2xl bg-slate-900 border border-slate-800 hover:border-blue-500 hover:-translate-y-1 transition space-y-3 ${kind(m) === 'LIVE' ? 'ring-1 ring-red-500/60 shadow-lg shadow-red-500/10' : ''}">
    <div class="flex justify-between items-center text-xs font-bold text-blue-400"><span class="truncate pr-2">${esc(m.competition?.name)}</span>${badge(m)}</div>
    <div class="flex justify-between items-center font-bold text-sm"><div class="flex items-center gap-2">${crest(m.homeTeam.crest)}${star(m.homeTeam.id)}<span>${esc(m.homeTeam.shortName || m.homeTeam.name)}</span></div><span class="text-lg">${show ? (h ?? 0) : ''}</span></div>
    <div class="flex justify-between items-center font-bold text-sm"><div class="flex items-center gap-2">${crest(m.awayTeam.crest)}${star(m.awayTeam.id)}<span>${esc(m.awayTeam.shortName || m.awayTeam.name)}</span></div><span class="text-lg">${show ? (a ?? 0) : ''}</span></div>
  </div>`;
}

function section(title, list) {
  if (!list.length) return '';
  return `<h2 class="text-lg font-black mt-8 mb-3">${title} <span class="text-slate-500 text-sm">(${list.length})</span></h2>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">${[...list].sort((a, b) => fv(b) - fv(a) || pri(a) - pri(b)).map(card).join('')}</div>`;
}

function vis() {
  const q = S.q.trim().toLowerCase();
  return S.matches.filter(m => ldate(m) === S.day && (S.league === 'ALL' || m.competition?.name === S.league) &&
    (!q || (m.homeTeam.name + ' ' + m.awayTeam.name).toLowerCase().includes(q)));
}
function viewMatches() {
  const chips = [['ALL','All'],['LIVE','Live'],['UP','Upcoming'],['FT','Completed']].map(([k, l]) =>
    `<button onclick="S.filter='${k}';render()" class="px-4 py-2 rounded-full text-xs font-bold border ${S.filter === k ? 'bg-blue-600 border-blue-500' : 'bg-slate-900 border-slate-700 text-slate-300'}">${l}</button>`).join('');
  let body;
  if (S.err) body = `<p class="text-red-400 text-sm mt-6">Failed to load data: ${esc(S.err)}</p>`;
  else if (!S.loaded) body = skel(6);
  else if (!S.matches.length) body = '<p class="text-slate-400 text-sm mt-6">No matches yet (or data is still loading).</p>';
  else {
    const live = vis().filter(m => kind(m) === 'LIVE');
    const up = vis().filter(m => kind(m) === 'UP').sort((x, y) => new Date(x.utcDate) - new Date(y.utcDate));
    const ft = vis().filter(m => kind(m) === 'FT').sort((x, y) => new Date(y.utcDate) - new Date(x.utcDate));
    const pp = vis().filter(m => kind(m) === 'PP'); const f = S.filter;
    body = (f === 'ALL' || f === 'LIVE' ? section(' Live Now', live) : '')
         + (f === 'ALL' || f === 'UP' ? section('⏰ Upcoming', up) : '')
         + (f === 'ALL' || f === 'FT' ? section(' Completed', ft) : '') + (f === 'ALL' ? section(' Postponed / Awaiting Update', pp) : '');
    if (!body) body = '<p class="text-slate-400 text-sm mt-6">No matches in this category.</p>';
  }
  const cnt = k => S.matches.filter(m => ldate(m) === S.day && kind(m) === k).length;
  const stat = (n, l, c) => `<div class="flex-1 min-w-[90px] p-4 rounded-2xl bg-slate-900/70 border border-slate-800 text-center"><div class="text-3xl font-black ${c}" data-count="${n}">${n}</div><div class="text-[10px] uppercase tracking-widest text-slate-400">${l}</div></div>`;
  const leagues = [...new Set(S.matches.map(m => m.competition?.name))].filter(Boolean);
  const lchips = ['ALL', ...leagues].map(l => `<button onclick="S.league=this.dataset.l;render()" data-l="${esc(l)}" class="px-3 py-1.5 rounded-lg text-[11px] font-bold ${S.league === l ? 'bg-cyan-500 text-slate-950' : 'bg-slate-800 text-slate-300'}">${l === 'ALL' ? 'All Leagues' : esc(l)}</button>`).join('');
  return `${strip()}${flash()}<section class="rounded-3xl p-6 sm:p-8 bg-gradient-to-br from-blue-500 via-blue-700 to-cyan-600 hero-anim border border-slate-800">
      <p class="text-xs font-bold tracking-widest text-cyan-400 uppercase"> Live Matchday</p>
      <h1 class="text-3xl sm:text-5xl font-black mt-1">Match Center</h1>
      <p class="text-xs text-slate-400 mt-1">Auto-refreshes every 60 seconds. Select a match for full details.</p>
      <div class="flex gap-3 mt-5 flex-wrap">${stat(cnt('LIVE'), 'Live', 'text-red-400')}${stat(cnt('UP'), 'Upcoming', 'text-blue-300')}${stat(cnt('FT'), 'Completed', 'text-emerald-400')}</div>
    </section>
    ${dayChips()}<input id="q" value="${esc(S.q)}" oninput="S.q=this.value;S.fq=1;qr()" placeholder=" Search teams..." class="w-full mt-5 p-3 rounded-xl bg-slate-900 border border-slate-700 text-sm">
    <div class="flex gap-2 flex-wrap mt-4">${chips}</div>
    <div class="flex gap-2 flex-wrap mt-3">${lchips}</div>${body}`;
}

// ============ DETAIL PERTANDINGAN ============
async function loadMatchPage(id) {
  $('app').classList.remove('noanim'); S.tab = 'sum'; S.af = null; S.sug = null; S.view = 'matches'; S.detailId = id; S.detail = null; S.detailErr = null; vt(render); window.scrollTo(0, 0);
  await loadDetail();
  loadExtras();
}
async function loadDetail() {
  if (!S.detailId) return;
  try { S.detail = await api('/api/match/' + S.detailId); S.detailErr = null; }
  catch (e) { S.detailErr = e.message; }
  if (S.detailId) qr();
}
function closeMatch() { history.length > 1 ? history.back() : (location.hash = '#/matches'); }

function viewDetail() {
  const back = '<button onclick="closeMatch()" class="mb-4 px-4 py-2 rounded-xl bg-slate-900 border border-slate-700 text-sm font-bold text-blue-400">← Back</button>';
  if (S.detailErr && !S.detail) return back + `<p class="text-red-400 text-sm">Failed to load details: ${esc(S.detailErr)}</p>`;
  const m = S.detail;
  if (!m) return back + skel(2);
  const k = kind(m);
  const ft = m.score?.fullTime || {}, ht = m.score?.halfTime || {};
  const statusText = k === 'LIVE' ? 'LIVE ' + liveText(m) : k === 'FT' ? 'FULL TIME' : fmtDate(m.utcDate) + ' · ' + gmt(m.utcDate) + ' GMT';
  const team = t => `<div class="flex-1 text-center space-y-2"><img src="${esc(t.crest)}" class="w-20 h-20 mx-auto object-contain" alt=""><div class="font-bold">${esc(t.name)}</div></div>`;

  const ev = [
    ...(m.goals || []).map(g => ({ min: g.minute, inj: g.injuryTime, side: g.team?.id === m.homeTeam.id ? 'h' : 'a', icon: ico('g'), text: (g.scorer?.name || 'Goals') + (g.assist?.name ? ` (assist: ${g.assist.name})` : '') })),
    ...(m.bookings || []).map(b => ({ min: b.minute, side: b.team?.id === m.homeTeam.id ? 'h' : 'a', icon: ico(b.card === 'RED' ? 'r' : 'y'), text: b.player?.name || 'Kartu' })),
    ...(m.substitutions || []).map(s => ({ min: s.minute, side: s.team?.id === m.homeTeam.id ? 'h' : 'a', icon: ico('s'), text: `${s.playerIn?.name || '?'} in, ${s.playerOut?.name || '?'} out` }))
  ].sort((x, y) => (x.min || 0) - (y.min || 0));

  const evHtml = ev.length ? ev.map(e => `<div class="flex items-center gap-3 py-2 border-b border-slate-800 text-sm ${e.side === 'a' ? 'flex-row-reverse text-right' : ''}">
      <span class="w-12 text-xs font-bold text-blue-400 ${e.side === 'a' ? 'text-left' : ''}">${e.min ?? ''}'${e.inj ? '+' + e.inj : ''}</span><span>${e.icon}</span><span>${esc(e.text)}</span></div>`).join('')
    : '<p class="text-slate-400 text-sm">No events provided by the data provider for this match yet.</p>';

  const info = [
    ['Competition', m.competition?.name], ['Babak/Matchday', m.matchday ? 'Matchday ' + m.matchday : m.stage],
    ['Venue', m.venue], ['Referee', (m.referees || [])[0]?.name], ['Half-time score', ht.home != null ? `${ht.home} - ${ht.away}` : null]
  ].filter(x => x[1]).map(([a, b]) => `<div class="flex justify-between py-2 border-b border-slate-800 text-sm"><span class="text-slate-400">${a}</span><span class="font-semibold text-right">${esc(b)}</span></div>`).join('');

  return back + `
  <div class="rounded-3xl p-6 sm:p-10 bg-gradient-to-b from-blue-600 to-indigo-800 hero-anim border border-slate-800">
    <p class="text-center text-xs font-bold tracking-widest text-blue-400 uppercase">${esc(m.competition?.name)}</p>
    <div class="flex items-center mt-6">
      ${team(m.homeTeam)}
      <div class="px-4 text-center">
        <div class="text-5xl sm:text-6xl font-black">${k === 'UP' || k === 'PP' ? 'vs' : (ft.home ?? 0) + ' - ' + (ft.away ?? 0)}</div>
        <div class="mt-2 text-xs font-bold ${k === 'LIVE' ? 'text-red-400 livebadge' : 'text-slate-300'}">${statusText}</div>
      </div>
      ${team(m.awayTeam)}
    </div>
  </div>
  ${tabsBar()}${S.tab === 'sum' ? stadium(m) : ''}${S.tab !== 'sum' ? tabBody(m) : ''}
  <div class="grid md:grid-cols-2 gap-4 mt-4 ${S.tab !== 'sum' ? 'hidden' : ''}">
    <div class="p-6 rounded-2xl bg-slate-900 border border-slate-800"><h3 class="font-black mb-2">Match Events</h3>${evHtml}</div>
    <div class="p-6 rounded-2xl bg-slate-900 border border-slate-800"><h3 class="font-black mb-2">Match Info</h3>${info || '<p class="text-slate-400 text-sm">No info yet.</p>'}</div>
  </div>${S.tab === 'sum' ? extras(m) : ''}`;
}

async function loadExtras() {
  S.h2h = null; S.pos = null; S.sug = null; S.fan = null; loadStats();
  try { S.h2h = await api('/api/h2h/' + S.detailId); } catch (e) {}
  try { S.sug = await api('/api/suggest/' + S.detailId); } catch (e) {}
  try { S.fan = await api('/api/fan/' + S.detailId); } catch (e) {}
  try {
    const c = S.detail?.competition?.code;
    if (COMPS[c]) {
      const d = await api('/api/standings/' + c);
      const t = (d.standings.find(x => x.type === 'TOTAL') || {}).table || [];
      S.pos = { h: t.find(r => r.team.id === S.detail.homeTeam.id), a: t.find(r => r.team.id === S.detail.awayTeam.id) };
    }

  if (S.detailId) qr();
}
function extras(m) {
  let out = sugCard(m);
  const pc = (t, r) => r ? `<div class="flex-1 text-center p-4 rounded-xl bg-slate-950/60 border border-slate-800">${crest(t.crest)}<div class="text-xs font-bold mt-1">${esc(t.shortName || t.name)}</div><div class="text-3xl font-black text-blue-400">#${r.position}</div><div class="text-[10px] text-slate-400 uppercase">${r.points} pts · ${r.playedGames} played</div></div>` : '';
  if (S.pos && (S.pos.h || S.pos.a)) out += `<div class="mt-4 p-6 rounded-2xl bg-slate-900 border border-slate-800"><h3 class="font-black mb-3">League Position</h3><div class="flex gap-3 items-center">${pc(m.homeTeam, S.pos.h)}<span class="text-slate-500 font-bold">VS</span>${pc(m.awayTeam, S.pos.a)}</div></div>`;
  const ag = S.h2h?.aggregates;
  if (ag && ag.numberOfMatches) {
    const hw = ag.homeTeam.id === m.homeTeam.id ? ag.homeTeam : ag.awayTeam, aw = hw === ag.homeTeam ? ag.awayTeam : ag.homeTeam;
    const n = ag.numberOfMatches, pct = x => Math.round(x / n * 100);
    const list = (S.h2h.matches || []).slice(0, 5).map(x => `<div class="flex justify-between text-xs py-1.5 border-b border-slate-800"><span class="text-slate-400">${fmtDate(x.utcDate)}</span><span>${esc(x.homeTeam.shortName || x.homeTeam.name)} <b>${x.score.fullTime.home}-${x.score.fullTime.away}</b> ${esc(x.awayTeam.shortName || x.awayTeam.name)}</span></div>`).join('');
    out += `<div class="mt-4 p-6 rounded-2xl bg-slate-900 border border-slate-800"><h3 class="font-black mb-3">Head to Head <span class="text-slate-500 text-xs">(${n} recent meetings)</span></h3>
      <div class="flex h-3 rounded-full overflow-hidden"><div class="bg-blue-500" style="width:${pct(hw.wins)}%"></div><div class="bg-slate-500" style="width:${pct(hw.draws)}%"></div><div class="bg-red-500" style="width:${pct(aw.wins)}%"></div></div>
      <div class="flex justify-between text-xs mt-2 font-bold"><span class="text-blue-400">${esc(m.homeTeam.shortName || m.homeTeam.name)} ${hw.wins}M</span><span class="text-slate-400">Draw ${hw.draws}</span><span class="text-red-400">${aw.wins}M ${esc(m.awayTeam.shortName || m.awayTeam.name)}</span></div>
      <div class="mt-3">${list}</div></div>`;
  }
  return out;
}

}
function flash() {
  const c = S.content, items = [...(c.transfers || []).slice(-3).map(x => ['TRANSFER', x.player + ': ' + x.detail]), ...(c.news || []).slice(-3).map(x => [(x.category || 'NEWS').toUpperCase(), x.title]), ...(c.takes || []).slice(-1).map(x => ['BRIGHT TAKE', x.title])];
  if (!items.length) return '';
  const it = items[S.fi % items.length];
  return `<div class="flex items-center gap-3 rounded-xl bg-slate-900 border border-slate-800 px-4 py-3 mb-4 text-sm"><span class="text-[10px] font-black tracking-widest text-blue-400 shrink-0">${esc(it[0])}</span><span class="flex-1 truncate">${esc(it[1])}</span><button onclick="S.fi++;qr()" class="text-xs text-slate-400 shrink-0">Next</button></div>`;
}
function pitchCard(m) {
  const a = S.af;
  const note = '<p class="text-[11px] text-slate-500 mt-3">Passing networks, heat zones and shot maps need tracking data that football-data.org and API-Football do not provide, so they are not shown.</p>';
  let body;
  if (!a) body = skel(1);
  else if (!a.available) body = `<p class="text-sm text-slate-400">Lineups are unavailable (${esc(a.reason || 'no data')}).</p>`;
  else if (!a.lineups || a.lineups.length < 2) body = '<p class="text-sm text-slate-400">Lineups are published by API-Football around an hour before kick-off.</p>';
  else {
    const hl = a.lineups.find(l => l.team.id === a.homeId) || a.lineups[0], al = a.lineups.find(l => l !== hl);
    const nodes = (l, home) => {
      const rows = {};
      (l.startXI || []).forEach(({ player: p }) => { const [r, c] = String(p.grid || '').split(':').map(Number); if (r && c) (rows[r] = rows[r] || []).push({ p, c }); });
      const R = Math.max(...Object.keys(rows).map(Number), 2);
      return Object.entries(rows).flatMap(([r, arr]) => arr.map(({ p, c }) => { const x = home ? 70 + (r - 1) / (R - 1) * 400 : 930 - (r - 1) / (R - 1) * 400, f = c / (arr.length + 1), y = 620 * (home ? f : 1 - f); return `<g transform="translate(${x.toFixed(0)} ${y.toFixed(0)})"><circle r="23" fill="${home ? '#fff' : '#7dd3fc'}" stroke="rgba(255,255,255,.6)" stroke-width="2"/><text y="6" text-anchor="middle" font-size="17" font-weight="800" fill="${home ? '#0057B8' : '#0b1f44'}">${esc(p.number)}</text><text y="44" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">${esc(String(p.name || '').split(' ').pop())}</text></g>`; })).join('');
    };
    body = `<svg viewBox="0 0 1000 620" class="w-full rounded-xl" style="background:linear-gradient(135deg,#0a2f6b,#0057B8)"><g fill="none" stroke="rgba(255,255,255,.4)" stroke-width="2"><rect x="10" y="10" width="980" height="600"/><path d="M500 10v600"/><circle cx="500" cy="310" r="80"/><rect x="10" y="150" width="150" height="320"/><rect x="840" y="150" width="150" height="320"/><rect x="10" y="230" width="55" height="160"/><rect x="935" y="230" width="55" height="160"/></g>${nodes(hl, true)}${nodes(al, false)}</svg><div class="flex justify-between text-xs font-bold mt-2"><span>${esc(m.homeTeam.shortName || m.homeTeam.name)} · ${esc(hl.formation || '')}</span><span>${esc(al.formation || '')} · ${esc(m.awayTeam.shortName || m.awayTeam.name)}</span></div>`;
  }
  return `<div class="p-5 rounded-2xl bg-slate-900 border border-slate-800"><h3 class="font-black mb-3">Tactical Pitch</h3>${body}${note}</div>`;
}
function fanCard(m) {
  const f = S.fan || { home: 0, draw: 0, away: 0 }, tot = f.home + f.draw + f.away;
  let voted = null; try { voted = localStorage.getItem('vote' + m.id); } catch (e) {}
  const open = kind(m) === 'UP' && !voted, nm = t => esc(t.shortName || t.name), pc = k => tot ? Math.round(f[k] / tot * 100) : 0;
  const opt = (k, l) => open ? `<button onclick="castVote('${k}')" class="flex-1 py-2 rounded-lg bg-slate-800 text-xs font-bold">${l}</button>` : `<div class="flex-1 text-center text-xs"><div class="font-black text-lg">${pc(k)}%</div><div class="text-slate-400 truncate">${l}</div></div>`;
  return `<div class="mt-4 p-5 rounded-2xl bg-slate-900 border border-slate-800"><h3 class="font-black mb-3">Fan Prediction <span class="text-xs text-slate-400 font-semibold">${tot} votes</span></h3><div class="flex gap-2">${opt('home', nm(m.homeTeam))}${opt('draw', 'Draw')}${opt('away', nm(m.awayTeam))}</div>${open ? '<p class="text-[11px] text-slate-500 mt-2">Vote to see what other fans think.</p>' : ''}</div>`;
}
async function castVote(c) {
  const id = S.detailId;
  try {
    const r = await fetch('/api/fan/' + id, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ choice: c }) });
    if (r.ok) S.fan = await r.json(); else if (r.status === 429) S.fan = await api('/api/fan/' + id); else return;
    try { localStorage.setItem('vote' + id, c); } catch (e) {}
  } catch (e) {}
  qr();
}
function stadium(m) { return `<div class="grid lg:grid-cols-3 gap-4 mt-4"><div class="lg:col-span-2">${pitchCard(m)}</div><div>${statsTab(m)}${fanCard(m)}</div></div>`; }

// ============ STANDINGS ============
async function loadStandings() {
  S.std = null; render();
  try { S.std = await api('/api/standings/' + S.comp); }
  catch (e) { S.std = { error: e.message }; }
  try { S.sc = (await api('/api/scorers/' + S.comp)).scorers; } catch (e) { S.sc = []; }
  if (S.view === 'standings') render();
}
function pickComp(c) { S.comp = c; loadStandings(); }

function viewStandings() {
  const chips = Object.entries(COMPS).map(([c, n]) =>
    `<button onclick="pickComp('${c}')" class="px-4 py-2 rounded-full text-xs font-bold border ${S.comp === c ? 'bg-blue-600 border-blue-500' : 'bg-slate-900 border-slate-700 text-slate-300'}">${n}</button>`).join('');
  let body = skel(2);
  if (S.std?.error) body = `<p class="text-red-400 text-sm mt-6">Failed to load standings: ${esc(S.std.error)}</p>`;
  else if (S.std?.standings) {
    const tables = S.std.standings.filter(s => s.type === 'TOTAL');
    body = tables.map(t => `<div class="mt-6 rounded-2xl bg-slate-900 border border-slate-800 overflow-x-auto">
      ${t.group ? `<div class="px-4 pt-4 text-xs font-bold text-blue-400">${esc(t.group.replace('_', ' '))}</div>` : ''}
      <table class="w-full text-sm"><thead><tr class="text-xs text-slate-400 text-center"><th class="p-3">#</th><th class="p-3 text-left">Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th class="pr-4">Pts</th></tr></thead><tbody>
      ${t.table.map(r => `<tr class="border-t border-slate-800 text-center"><td class="p-3 text-slate-400">${r.position}</td>
        <td class="p-3 text-left"><div class="flex items-center gap-2">${crest(r.team.crest)}<span class="font-semibold">${esc(r.team.shortName || r.team.name)}</span></div></td>
        <td>${r.playedGames}</td><td>${r.won}</td><td>${r.draw}</td><td>${r.lost}</td><td>${r.goalDifference > 0 ? '+' : ''}${r.goalDifference}</td><td class="pr-4 font-black text-blue-400">${r.points}</td></tr>`).join('')}
      </tbody></table></div>`).join('') || '<p class="text-slate-400 text-sm mt-6">Standings belum tersedia.</p>';
  }
  return `<h1 class="text-3xl font-black">Standings</h1><p class="text-xs text-slate-400 mb-4">Live from the football data feed.</p><div class="flex gap-2 flex-wrap">${chips}</div>${body}${scorers()}`;
}

// ============ ADMIN ============
const $0 = 0;
const $ = id => document.getElementById(id);
const $v = id => $(id).value;

// ============ RENDER & NAVIGASI ============
function render() {
  hook();
  setTimeout(() => { const qi = $('q'); if (S.fq && qi) { qi.focus(); qi.setSelectionRange(qi.value.length, qi.value.length); S.fq = 0; } }, 0);
  ['home','matches','standings','predictions','record','kits','admin'].forEach(v => {
    $('nav-' + v).className = 'px-3 py-2 rounded-lg ' + (S.view === v ? 'bg-blue-600 text-white' : 'text-slate-300 hover:bg-slate-800');
  });
  const V = { home: viewHome, matches: () => S.detailId ? viewDetail() : viewMatches(), standings: viewStandings, predictions: viewPredictions, record: viewRecord, kits: viewKits, admin: viewAdmin };
  $('app').innerHTML = V[S.view]();
}

window.onload = () => {
  applyRoute(); loadMatches(); loadContent();
  setInterval(loadMatches, 60000);
  setInterval(() => { if (S.view === 'matches' && S.detailId) loadDetail(); }, 30000);
};
</script>
</body>
</html>
