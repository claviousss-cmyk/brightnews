<footer class="border-t border-slate-800 py-10 text-center text-xs text-slate-500"><div class="flex justify-center gap-3 mb-4"><a class="soc" href="https://instagram.com/brightnewss" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg></a><a class="soc" href="https://www.tiktok.com/@brightnewss" target="_blank" rel="noopener" aria-label="TikTok"><svg viewBox="0 0 24 24" class="w-5 h-5" fill="currentColor"><path d="M16.6 3c.3 2.3 1.7 3.8 4 3.9v3.1c-1.5 0-2.9-.5-4-1.2v6.2c0 3.2-2.6 5.5-5.6 5.5S5.4 18.2 5.4 15.2c0-3.3 2.8-5.8 6.2-5.4v3.2c-1.7-.4-3 .7-3 2.2 0 1.3 1 2.3 2.3 2.3s2.4-1 2.4-2.5V3z"/></svg></a></div><p>&copy; 2026 BRIGHTNEWS MEDIA &middot; THE GAME, BEYOND THE SCORE &middot; @brightnewss</p></footer>

<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COMPS = { PL:'Premier League', PD:'La Liga', SA:'Drawe A', BL1:'Bundesliga', FL1:'Ligue 1', CL:'Champions League', ELC:'Championship', DED:'Eredivisie', PPL:'Primeira Liga', BSA:'Brasileirao' };
let S = { q:'', fq:0, league:'ALL', h2h:null, pos:null, view:'home', filter:'ALL', comp:'PL', matches:[], err:null, detailId:null, detail:null, detailErr:null, std:null };

const kind = m => ['IN_PLAY','PAUSED'].includes(m.status) ? 'LIVE' : m.status === 'FINISHED' ? 'FT' : (['POSTPONED','CANCELLED','SUSPENDED','AWARDED'].includes(m.status) || Date.parse(m.utcDate) < Date.now() - 3 * 3600e3) ? 'PP' : 'UP';
const fmtTime = d => new Date(d).toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
const fmtDate = d => new Date(d).toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
const crest = u => u ? `<img src="${esc(u)}" class="w-7 h-7 object-contain" alt="">` : '<span class="w-7 h-7"></span>';

async function api(url) {
  const r = await fetch(url, S.token ? { headers: { 'x-token': S.token } } : undefined);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);
  return j;
}

// ============ MATCHES ============
async function loadMatches() {
  try { S.matches = (await api('/api/matches')).matches || []; S.err = null; }
  catch (e) { S.err = e.message; }
  S.loaded = true;
  if (['home','matches'].includes(S.view) && !S.detailId) qr();
}

function badge(m) {
  const k = kind(m);
  if (k === 'LIVE') return `<span class="px-2 py-0.5 rounded bg-red-500/20 text-red-400 livebadge">LIVE ${minuteOf(m)}</span>`;
  if (k === 'PP') return '<span class="px-2 py-0.5 rounded bg-amber-500/20 text-amber-300"> ' + (m.status === 'POSTPONED' ? 'Postponed' : 'Awaiting update') + '</span>';
  if (k === 'FT') return '<span class="px-2 py-0.5 rounded bg-slate-800 text-slate-300">FT</span>';
  return `<span class="px-2 py-0.5 rounded bg-blue-500/20 text-blue-300">${gmt(m.utcDate)} GMT</span>`;
}

function card(m) {
  const h = m.score?.fullTime?.home, a = m.score?.fullTime?.away;
  const show = ['LIVE', 'FT'].includes(kind(m));
  return `<div onclick="openMatch(${m.id})" class="cursor-pointer p-5 rounded-2xl bg-slate-900 border border-slate-800 hover:border-blue-500 hover:-translate-y-1 transition space-y-3 ${kind(m) === 'LIVE' ? 'ring-1 ring-red-500/60 shadow-lg shadow-red-500/10' : ''}">
    <div class="flex justify-between items-center text-xs font-bold text-blue-400"><span class="truncate pr-2">${esc(m.competition?.name)}</span>${badge(m)}</div>
    <div class="flex justify-between items-center font-bold text-sm"><div class="flex items-center gap-2">${crest(m.homeTeam.crest)}${star(m.homeTeam.id)}<span>${esc(m.homeTeam.shortName || m.homeTeam.name)}</span></div><span class="text-lg">${show ? (h ?? 0) : ''}</span></div>
    <div class="flex justify-between items-center font-bold text-sm"><div class="flex items-center gap-2">${crest(m.awayTeam.crest)}${star(m.awayTeam.id)}<span>${esc(m.awayTeam.shortName || m.awayTeam.name)}</span></div><span class="text-lg">${show ? (a ?? 0) : ''}</span></div>
  </div>`;
}

function section(title, list) {
  if (!list.length) return '';
  return `<h2 class="text-lg font-black mt-8 mb-3">${title} <span class="text-slate-500 text-sm">(${list.length})</span></h2>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">${[...list].sort((a, b) => fv(b) - fv(a) || pri(a) - pri(b)).map(card).join('')}</div>`;
}

function vis() {
  const q = S.q.trim().toLowerCase();
  return S.matches.filter(m => ldate(m) === S.day && (S.league === 'ALL' || m.competition?.name === S.league) &&
    (!q || (m.homeTeam.name + ' ' + m.awayTeam.name).toLowerCase().includes(q)));
}
function viewMatches() {
  const chips = [['ALL','All'],['LIVE','Live'],['UP','Upcoming'],['FT','Completed']].map(([k, l]) =>
    `<button onclick="S.filter='${k}';render()" class="px-4 py-2 rounded-full text-xs font-bold border ${S.filter === k ? 'bg-blue-600 border-blue-500' : 'bg-slate-900 border-slate-700 text-slate-300'}">${l}</button>`).join('');
  let body;
  if (S.err) body = `<p class="text-red-400 text-sm mt-6">Failed to load data: ${esc(S.err)}</p>`;
  else if (!S.loaded) body = skel(6);
  else if (!S.matches.length) body = '<p class="text-slate-400 text-sm mt-6">No matches yet (or data is still loading).</p>';
  else {
    const live = vis().filter(m => kind(m) === 'LIVE');
    const up = vis().filter(m => kind(m) === 'UP').sort((x, y) => new Date(x.utcDate) - new Date(y.utcDate));
    const ft = vis().filter(m => kind(m) === 'FT').sort((x, y) => new Date(y.utcDate) - new Date(x.utcDate));
    const pp = vis().filter(m => kind(m) === 'PP'); const f = S.filter;
    body = (f === 'ALL' || f === 'LIVE' ? section(' Live Now', live) : '')
         + (f === 'ALL' || f === 'UP' ? section('⏰ Upcoming', up) : '')
         + (f === 'ALL' || f === 'FT' ? section(' Completed', ft) : '') + (f === 'ALL' ? section(' Postponed / Awaiting Update', pp) : '');
    if (!body) body = '<p class="text-slate-400 text-sm mt-6">No matches in this category.</p>';
  }
  const cnt = k => S.matches.filter(m => ldate(m) === S.day && kind(m) === k).length;
  const stat = (n, l, c) => `<div class="flex-1 min-w-[90px] p-4 rounded-2xl bg-slate-900/70 border border-slate-800 text-center"><div class="text-3xl font-black ${c}" data-count="${n}">${n}</div><div class="text-[10px] uppercase tracking-widest text-slate-400">${l}</div></div>`;
  const leagues = [...new Set(S.matches.map(m => m.competition?.name))].filter(Boolean);
  const lchips = ['ALL', ...leagues].map(l => `<button onclick="S.league=this.dataset.l;render()" data-l="${esc(l)}" class="px-3 py-1.5 rounded-lg text-[11px] font-bold ${S.league === l ? 'bg-cyan-500 text-slate-950' : 'bg-slate-800 text-slate-300'}">${l === 'ALL' ? 'All Leagues' : esc(l)}</button>`).join('');
  return `${strip()}${flash()}<section class="rounded-3xl p-6 sm:p-8 bg-gradient-to-br from-blue-500 via-blue-700 to-cyan-600 hero-anim border border-slate-800">
      <p class="text-xs font-bold tracking-widest text-cyan-400 uppercase"> Live Matchday</p>
      <h1 class="text-3xl sm:text-5xl font-black mt-1">Match Center</h1>
      <p class="text-xs text-slate-400 mt-1">Auto-refreshes every 60 seconds. Select a match for full details.</p>
      <div class="flex gap-3 mt-5 flex-wrap">${stat(cnt('LIVE'), 'Live', 'text-red-400')}${stat(cnt('UP'), 'Upcoming', 'text-blue-300')}${stat(cnt('FT'), 'Completed', 'text-emerald-400')}</div>
    </section>
    ${dayChips()}<input id="q" value="${esc(S.q)}" oninput="S.q=this.value;S.fq=1;qr()" placeholder=" Search teams..." class="w-full mt-5 p-3 rounded-xl bg-slate-900 border border-slate-700 text-sm">
    <div class="flex gap-2 flex-wrap mt-4">${chips}</div>
    <div class="flex gap-2 flex-wrap mt-3">${lchips}</div>${body}`;
}

// ============ DETAIL PERTANDINGAN ============
async function loadMatchPage(id) {
  $('app').classList.remove('noanim'); S.tab = 'sum'; S.af = null; S.sug = null; S.view = 'matches'; S.detailId = id; S.detail = null; S.detailErr = null; vt(render); window.scrollTo(0, 0);
  await loadDetail();
  loadExtras();
}
async function loadDetail() {
  if (!S.detailId) return;
  try { S.detail = await api('/api/match/' + S.detailId); S.detailErr = null; }
  catch (e) { S.detailErr = e.message; }
  if (S.detailId) qr();
}
function closeMatch() { history.length > 1 ? history.back() : (location.hash = '#/matches'); }


async function loadExtras() {
  S.h2h = null; S.pos = null; S.sug = null; S.fan = null; loadStats(); loadForm();
  try { S.h2h = await api('/api/h2h/' + S.detailId); } catch (e) {}
  try { S.sug = await api('/api/suggest/' + S.detailId); } catch (e) {}
  try { S.fan = await api('/api/fan/' + S.detailId); } catch (e) {}
  try {
    const c = S.detail?.competition?.code;
    if (COMPS[c]) {
      const d = await api('/api/standings/' + c);
      const t = (d.standings.find(x => x.type === 'TOTAL') || {}).table || [];
      S.pos = { h: t.find(r => r.team.id === S.detail.homeTeam.id), a: t.find(r => r.team.id === S.detail.awayTeam.id) };
    }
  } catch (e) {}
  if (S.detailId) qr();
}
function extras(m) {
  let out = sugCard(m);
  const pc = (t, r) => r ? `<div class="flex-1 text-center p-4 rounded-xl bg-slate-950/60 border border-slate-800">${crest(t.crest)}<div class="text-xs font-bold mt-1">${esc(t.shortName || t.name)}</div><div class="text-3xl font-black text-blue-400">#${r.position}</div><div class="text-[10px] text-slate-400 uppercase">${r.points} pts · ${r.playedGames} played</div></div>` : '';
  if (S.pos && (S.pos.h || S.pos.a)) out += `<div class="mt-4 p-6 rounded-2xl bg-slate-900 border border-slate-800"><h3 class="font-black mb-3">League Position</h3><div class="flex gap-3 items-center">${pc(m.homeTeam, S.pos.h)}<span class="text-slate-500 font-bold">VS</span>${pc(m.awayTeam, S.pos.a)}</div></div>`;
  const ag = S.h2h?.aggregates;
  if (ag && ag.numberOfMatches) {
    const hw = ag.homeTeam.id === m.homeTeam.id ? ag.homeTeam : ag.awayTeam, aw = hw === ag.homeTeam ? ag.awayTeam : ag.homeTeam;
    const n = ag.numberOfMatches, pct = x => Math.round(x / n * 100);
    const list = (S.h2h.matches || []).slice(0, 5).map(x => `<div class="flex justify-between text-xs py-1.5 border-b border-slate-800"><span class="text-slate-400">${fmtDate(x.utcDate)}</span><span>${esc(x.homeTeam.shortName || x.homeTeam.name)} <b>${x.score.fullTime.home}-${x.score.fullTime.away}</b> ${esc(x.awayTeam.shortName || x.awayTeam.name)}</span></div>`).join('');
    out += `<div class="mt-4 p-6 rounded-2xl bg-slate-900 border border-slate-800"><h3 class="font-black mb-3">Head to Head <span class="text-slate-500 text-xs">(${n} recent meetings)</span></h3>
      <div class="flex h-3 rounded-full overflow-hidden"><div class="bg-blue-500" style="width:${pct(hw.wins)}%"></div><div class="bg-slate-500" style="width:${pct(hw.draws)}%"></div><div class="bg-red-500" style="width:${pct(aw.wins)}%"></div></div>
      <div class="flex justify-between text-xs mt-2 font-bold"><span class="text-blue-400">${esc(m.homeTeam.shortName || m.homeTeam.name)} ${hw.wins}M</span><span class="text-slate-400">Draw ${hw.draws}</span><span class="text-red-400">${aw.wins}M ${esc(m.awayTeam.shortName || m.awayTeam.name)}</span></div>
      <div class="mt-3">${list}</div></div>`;
  }
  return out;
}

S.content = { predictions: [], news: [], kits: [] }; S.token = null; S.sc = null;
try { S.fav = JSON.parse(localStorage.getItem('fav') || '[]'); } catch (e) { S.fav = []; }
try { if (localStorage.getItem('theme') !== 'day') document.documentElement.classList.add('night'); } catch (e) { document.documentElement.classList.add('night'); }
const fv = m => (S.fav.includes(m.homeTeam.id) || S.fav.includes(m.awayTeam.id)) ? 1 : 0;
function toggleFav(ev, id) { ev.stopPropagation(); S.fav = S.fav.includes(id) ? S.fav.filter(x => x !== id) : [...S.fav, id]; try { localStorage.setItem('fav', JSON.stringify(S.fav)); } catch (e) {} render(); }
const star = id => `<button onclick="toggleFav(event,${id})" class="mr-1 ${S.fav.includes(id) ? 'text-blue-400' : 'text-slate-500'}">${STAR}</button>`;
function toggleTheme() { const n = document.documentElement.classList.toggle('night'); try { localStorage.setItem('theme', n ? 'night' : 'day'); } catch (e) {} }
async function loadContent() { try { S.content = await api('/api/content'); } catch (e) {} if (['home', 'predictions', 'record', 'kits'].includes(S.view) || (S.view === 'admin' && S.token)) render(); }

const empty = t => `<p class="text-slate-400 text-sm mt-6">${t}</p>`;
const title = (h, sub) => `<h1 class="text-3xl font-black">${h}</h1><p class="text-xs text-slate-400 mb-4">${sub}</p>`;

function scorers() {
  if (!S.sc || !S.sc.length) return '';
  return `<h2 class="text-lg font-black mt-8 mb-3"> Top Scorers</h2><div class="rounded-2xl bg-slate-900 border border-slate-800 divide-y divide-slate-800">${S.sc.map((x, i) => `<div class="flex items-center gap-3 p-3 text-sm"><span class="w-5 text-slate-400">${i + 1}</span>${crest(x.team.crest)}<span class="flex-1 font-semibold">${esc(x.player.name)} <span class="text-slate-500 text-xs">${esc(x.team.shortName || x.team.name)}</span></span><b class="text-blue-400">${x.goals}</b></div>`).join('')}</div>`;
}

// ============ ADMIN ============
const v = id => $(id).value;
const inp = (id, ph, v = '') => `<input id="${id}" value="${esc(v)}" placeholder="${ph}" class="w-full p-2.5 rounded-lg bg-slate-800 border border-slate-700 text-sm">`;
const save = js => `<button onclick="${js}" class="w-full py-2.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-sm font-bold">Save</button>`;
const hdr = () => ({ 'Content-Type': 'application/json', 'x-token': S.token });
async function login() {
  try {
    const r = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: v('adm-user'), password: v('adm-pass') }) });
    if (!r.ok) return alert('Wrong username or password');
    S.token = (await r.json()).token; await loadContent(); render();
  } catch (e) { alert('Cannot reach the server'); }
}
async function adm(url, method, body) {
  const r = await fetch(url, { method, headers: hdr(), body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) return alert('Failed. Please sign in again.');
  await loadContent(); render();
}
const addItem = (type, item) => adm('/api/content', 'POST', { type, item });
const delItem = (t, id) => confirm('Delete?') && adm(`/api/content/${t}/${id}`, 'DELETE');
const setRes = (id, result) => adm('/api/content/predictions/' + id, 'PATCH', { result });

S.day = new Date().toLocaleDateString('sv'); S.tab = 'sum'; S.form = {}; S.af = null;
const ymd = d => new Date(d).toLocaleDateString('sv');
const ldate = m => ymd(m.utcDate);
const qr = () => { $('app').classList.add('noanim'); render(); };
function dayChips() {
  const out = [];
  for (let i = -2; i <= 3; i++) {
    const d = new Date(Date.now() + i * 864e5), k = ymd(d), n = S.matches.filter(m => ldate(m) === k).length;
    const lab = i === 0 ? 'Today' : i === 1 ? 'Tomorrow' : i === -1 ? 'Yesterday' : d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
    out.push(`<button onclick="S.day='${k}';render()" class="shrink-0 px-4 py-2 rounded-xl text-xs font-bold ${S.day === k ? 'bg-cyan-400 text-slate-950' : 'bg-slate-800 text-slate-200'}">${lab}<span class="ml-1 opacity-70">${n}</span></button>`);
  }
  return `<div class="flex gap-2 overflow-x-auto mt-5 pb-1">${out.join('')}</div>`;
}
const tabsBar = () => `<div class="flex gap-2 mt-5">${[['sum', 'Overview'], ['stats', 'Stats'], ['form', 'Form']].map(([k, l]) => `<button onclick="setTab('${k}')" class="px-5 py-2 rounded-full text-xs font-bold ${S.tab === k ? 'bg-cyan-400 text-slate-950' : 'bg-slate-800 text-slate-200'}">${l}</button>`).join('')}<button onclick="copyLink()" class="ml-auto px-4 py-2 rounded-full text-xs font-bold bg-slate-800">Copy link</button><button onclick="shareMatch()" class="px-4 py-2 rounded-full text-xs font-bold bg-slate-800">Share image</button></div>`;
function setTab(t) { S.tab = t; qr(); if (t === 'form') loadForm(); if (t === 'stats') loadStats(); }
async function loadForm() {
  const m = S.detail; if (!m) return;
  for (const t of [m.homeTeam, m.awayTeam]) {
    if (S.form[t.id]) continue;
    try { S.form[t.id] = (await api('/api/form/' + t.id)).matches || []; } catch (e) { S.form[t.id] = []; }
    if (S.detailId) qr();
  }
}
async function loadStats() {
  const m = S.detail; if (!m || S.af) return;
  try { S.af = await api(`/api/af/match?date=${m.utcDate.slice(0, 10)}&home=${encodeURIComponent(m.homeTeam.name)}&away=${encodeURIComponent(m.awayTeam.name)}`); }
  catch (e) { S.af = { available: false, reason: e.message }; }
  if (S.detailId) qr();
}
function formBlock(t) {
  const l = S.form[t.id];
  if (!l) return '<p class="text-xs text-slate-400">Loading...</p>';
  if (!l.length) return '<p class="text-xs text-slate-400">No data yet.</p>';
  const rows = [...l].sort((a, b) => new Date(b.utcDate) - new Date(a.utcDate)).slice(0, 5).map(x => {
    const home = x.homeTeam.id === t.id, h = x.score.fullTime.home, a = x.score.fullTime.away, me = home ? h : a, op = home ? a : h;
    return { r: me > op ? 'W' : me < op ? 'L' : 'D', x, h, a };
  });
  const col = r => r === 'W' ? 'bg-emerald-500' : r === 'L' ? 'bg-red-500' : 'bg-slate-500';
  return `<div class="flex gap-2 mb-3">${[...rows].reverse().map(o => `<span class="w-9 h-9 rounded-full ${col(o.r)} flex items-center justify-center text-sm font-black">${o.r}</span>`).join('')}</div>` +
    rows.map(o => `<div class="flex justify-between text-xs py-1.5 border-b border-slate-800"><span class="text-slate-400">${fmtDate(o.x.utcDate)}</span><span>${esc(o.x.homeTeam.shortName || o.x.homeTeam.name)} <b>${o.h}-${o.a}</b> ${esc(o.x.awayTeam.shortName || o.x.awayTeam.name)}</span></div>`).join('');
}
const num = v => parseFloat(String(v)) || 0;
const bar = (l, h, a) => { const n = num(h) + num(a) || 1, p = Math.round(num(h) / n * 100); return `<div class="py-2"><div class="flex justify-between text-sm font-bold"><span>${esc(h)}</span><span class="text-xs text-slate-400 font-semibold">${l}</span><span>${esc(a)}</span></div><div class="flex h-2 rounded-full overflow-hidden bg-slate-800 mt-1"><div class="bar bg-cyan-400" style="width:${p}%"></div><div class="flex-1 bg-indigo-400"></div></div></div>`; };
function statsTab(m) {
  const a = S.af, nm = t => esc(t.shortName || t.name);
  const head = `<div class="flex justify-between font-black text-sm mb-2"><span>${nm(m.homeTeam)}</span><span>${nm(m.awayTeam)}</span></div>`;

  if (a && a.available && (a.events || []).length) return a.events.map(e => { const d = String(e.detail || ''), x = e.time?.extra || 0, el = e.time?.elapsed ?? 0; return { min: el + (x ? '+' + x : ''), o: el * 100 + x, t: e.type === 'Goal' ? 'g' : e.type === 'Card' ? (d.includes('Red') ? 'r' : 'y') : e.type === 'subst' ? 's' : 'v', text: e.type === 'subst' ? `${e.assist?.name || '?'} in, ${e.player?.name || '?'} out` : (e.player?.name || d) + (e.type === 'Goal' && d !== 'Normal Goal' ? ` (${d})` : ''), sub: e.type === 'Goal' && e.assist?.name ? 'Assist: ' + e.assist.name : (e.team?.name || '') }; });
  return [...(m.goals || []).map(g => ({ min: g.minute + (g.injuryTime ? '+' + g.injuryTime : ''), o: g.minute * 100 + (g.injuryTime || 0), t: 'g', text: g.scorer?.name || 'Goal', sub: g.assist?.name ? 'Assist: ' + g.assist.name : (g.team?.name || '') })), ...(m.bookings || []).map(b => ({ min: String(b.minute), o: b.minute * 100, t: b.card === 'RED' ? 'r' : 'y', text: b.player?.name || 'Card', sub: b.team?.name || '' })), ...(m.substitutions || []).map(s => ({ min: String(s.minute), o: s.minute * 100, t: 's', text: `${s.playerIn?.name || '?'} in, ${s.playerOut?.name || '?'} out`, sub: s.team?.name || '' }))];
}
function eventsCard(m) {
  const rows = eventsOf(m).sort((x, y) => y.o - x.o).map(e => `<div class="flex items-center gap-3 py-2.5 border-b border-slate-800"><span class="w-12 text-xs font-bold text-slate-400">${esc(e.min)}'</span><span class="w-6 flex justify-center">${e.t === 'v' ? '<span class="text-[9px] font-black text-blue-400">VAR</span>' : ico(e.t)}</span><div class="min-w-0"><div class="text-sm font-bold truncate">${esc(e.text)}</div><div class="text-[11px] text-slate-400 truncate">${esc(e.sub)}</div></div></div>`).join('');
  return `<div class="panel"><h3 class="font-black mb-2">Match Events</h3><div class="max-h-[460px] overflow-y-auto pr-1">${rows || '<p class="text-sm text-slate-400">No events provided by the data provider for this match yet.</p>'}</div></div>`;
}
function statsCard(m) {
  const a = S.af, nm = t => esc(t.shortName || t.name);
  let body;
  if (!a) body = skel(1);
  else if (a.available && (a.statistics || []).length >= 2) {
    const hs = a.statistics.find(s => s.team.id === a.homeId) || a.statistics[0], as = a.statistics.find(s => s !== hs);
    const g = (s, t) => { const x = (s.statistics || []).find(y => y.type === t); return x && x.value != null ? x.value : 0; };
    const ph = num(g(hs, 'Ball Possession')), pa = num(g(as, 'Ball Possession'));
    const rows = [['Total Shots', 'Total shots'], ['Shots on Goal', 'Shots on target'], ['Corner Kicks', 'Corners'], ['Fouls', 'Fouls'], ['Yellow Cards', 'Yellow cards'], ['Red Cards', 'Red cards'], ['Offsides', 'Offsides'], ['expected_goals', 'Expected goals (xG)'], ['Goalkeeper Saves', 'Saves'], ['Passes %', 'Pass accuracy']];
    body = (ph || pa ? `<div class="flex justify-around mb-1"><div class="text-center"><div class="donut" style="--p:${ph}"><span>${ph}%</span></div><div class="text-[11px] text-slate-400 mt-1">${nm(m.homeTeam)}</div></div><div class="text-center"><div class="donut alt" style="--p:${pa}"><span>${pa}%</span></div><div class="text-[11px] text-slate-400 mt-1">${nm(m.awayTeam)}</div></div></div><p class="text-center text-[11px] text-slate-400 mb-2">Possession</p>` : '') + rows.map(([k, l]) => bar(l, g(hs, k), g(as, k))).join('');
  } else {
    const P = S.pos, r = (t, f) => P && P[t] ? P[t][f] : '-';
    body = `<p class="text-xs text-amber-300 mb-3">Live statistics unavailable (${esc(a.reason || 'no data')}). Showing season comparison instead.</p>` + (P && (P.h || P.a) ? [['Played', 'playedGames'], ['Won', 'won'], ['Draw', 'draw'], ['Lost', 'lost'], ['Goals', 'goalsFor'], ['Conceded', 'goalsAgainst'], ['Points', 'points']].map(([l, f]) => bar(l, r('h', f), r('a', f))).join('') : '<p class="text-slate-400 text-sm">Standings not available for this competition.</p>');
  }
  return `<div class="panel"><h3 class="font-black mb-3">Match Statistics</h3><div class="flex justify-between font-black text-sm mb-1"><span>${nm(m.homeTeam)}</span><span>${nm(m.awayTeam)}</span></div>${body}</div>`;
}
function viewDetail() {
  const m = S.detail, nmx = t => esc(t.shortName || t.name);
  const crumb = `<div class="flex items-center justify-between gap-2 mb-4 text-xs"><div class="text-slate-400 truncate"><a href="#/matches" class="font-bold hover:underline">Matches</a> › ${m ? esc(m.competition?.name) + ' › ' + nmx(m.homeTeam) + ' vs ' + nmx(m.awayTeam) : '...'}</div><button onclick="closeMatch()" class="shrink-0 px-4 py-2 rounded-lg bg-slate-800 font-bold">← Back to Matches</button></div>`;
  if (S.detailErr && !m) return crumb + `<p class="text-red-400 text-sm">Failed to load details: ${esc(S.detailErr)}</p>`;
  if (!m) return crumb + skel(2);
  const k = kind(m), ft = m.score?.fullTime || {}, ht = m.score?.halfTime || {}, live = k === 'LIVE';
  const side = t => `<div class="flex-1 min-w-0 flex flex-col items-center gap-3 text-center"><img src="${esc(t.crest)}" alt="" class="w-16 h-16 sm:w-24 sm:h-24 object-contain" style="filter:drop-shadow(0 0 18px rgba(125,184,255,.65))"><div class="disp text-xl sm:text-3xl leading-tight max-w-full truncate">${esc(t.shortName || t.name)}</div></div>`;
  const sp = live ? `<div class="live-pill">Live · ${esc(liveText(m))}</div>` : k === 'FT' ? '<div class="ft-pill">Full Time</div>' : `<div class="ft-pill">${fmtDate(m.utcDate)} · ${gmt(m.utcDate)} GMT</div>`;
  const board = `<section class="board relative overflow-hidden rounded-3xl p-6 sm:p-10 text-white">${bdImg()}<div class="board-shade"></div><div class="relative">
    <div class="text-center text-xs font-bold tracking-widest uppercase opacity-90">${esc(m.competition?.name)}${m.matchday ? ' · Matchday ' + m.matchday : ''}</div>
    ${m.venue ? `<div class="text-center text-[11px] opacity-70 mt-1">${esc(m.venue)} · ${fmtDate(m.utcDate)} · ${gmt(m.utcDate)} GMT</div>` : ''}
    <div class="flex items-center gap-2 mt-6">${side(m.homeTeam)}<div class="text-center px-2 sm:px-8 shrink-0"><div class="score disp">${k === 'UP' || k === 'PP' ? 'VS' : (ft.home ?? 0) + ' - ' + (ft.away ?? 0)}</div><div class="mt-3">${sp}</div>${ht.home != null && k !== 'UP' ? `<div class="text-xs mt-2 opacity-70">(${ht.home} - ${ht.away})</div>` : ''}</div>${side(m.awayTeam)}</div></div></section>`;
  const tabs = `<div class="flex flex-wrap items-center gap-2 mt-5">${[['sum', 'Overview'], ['stats', 'Statistics'], ['events', 'Events'], ['lineups', 'Lineups'], ['h2h', 'H2H']].map(([a, l]) => `<button onclick="setTab('${a}')" class="tabb ${S.tab === a ? 'on' : ''}">${l}</button>`).join('')}<span class="ml-auto flex gap-2"><button onclick="copyLink()" class="tabb">Copy link</button><button onclick="shareMatch()" class="tabb">Share image</button></span></div>`;
  const rows = [['Competition', m.competition?.name], ['Date', fmtDate(m.utcDate) + ' · ' + gmt(m.utcDate) + ' GMT'], ['Venue', m.venue], ['Referee', (m.referees || [])[0]?.name], ['Matchday', m.matchday], ['Half-time', ht.home != null ? ht.home + ' - ' + ht.away : null]].filter(x => x[1]);
  const info = `<div class="panel"><h3 class="font-black mb-2">Match Info</h3>${rows.map(([a, b]) => `<div class="flex justify-between py-2 border-b border-slate-800 text-sm gap-3"><span class="text-slate-400">${a}</span><span class="font-semibold text-right">${esc(b)}</span></div>`).join('')}</div>`;
  const formC = `<div class="panel"><h3 class="font-black mb-3">Team Form</h3>${[m.homeTeam, m.awayTeam].map(t => `<div class="mb-3"><div class="flex items-center gap-2 mb-2 text-sm font-bold">${crest(t.crest)}${nmx(t)}</div>${formChips(t)}</div>`).join('')}</div>`;
  const body = S.tab === 'stats' ? `<div class="mt-4">${statsCard(m)}</div>` : S.tab === 'events' ? `<div class="mt-4">${eventsCard(m)}</div>` : S.tab === 'lineups' ? `<div class="mt-4">${pitchCard(m)}</div>` : S.tab === 'h2h' ? extras(m) : `<div class="grid lg:grid-cols-3 gap-4 mt-4">${statsCard(m)}${eventsCard(m)}<div class="space-y-4">${formC}${info}</div></div>${fanCard(m)}${extras(m)}`;
  return crumb + board + tabs + body;
}
const predStats = () => { const p = pub(), n = r => p.filter(x => x.result === r).length, w = n('won'), l = n('lost'); return { p, w, l, pe: p.filter(x => !x.result || x.result === 'pending').length, wr: w + l ? Math.round(w / (w + l) * 100) : 0 }; };
function viewPredictions() {
  const { p, wr } = predStats(), f = S.pf;
  const list = [...p].reverse().filter(x => f === 'all' || (f === 'pending' ? (!x.result || x.result === 'pending') : x.result === f));
  const tabs = [['all', 'All Predictions'], ['pending', 'Pending'], ['won', 'Won'], ['lost', 'Lost']].map(([k, l]) => `<button onclick="S.pf='${k}';render()" class="tabb ${f === k ? 'on' : ''}">${l}</button>`).join('');
  return `<section class="page-hero relative overflow-hidden rounded-3xl p-8 sm:p-12 text-white">${bdImg()}<div class="board-shade"></div><div class="relative flex flex-wrap items-center justify-between gap-6"><div><h1 class="disp text-5xl sm:text-7xl">Predictions</h1><p class="text-sm opacity-80 mt-1">Expert insights. Data-driven predictions.</p></div><div class="glassbox text-center"><div class="text-[10px] tracking-widest opacity-80">WIN RATE</div><div class="disp text-5xl">${wr}%</div></div></div></section><div class="flex flex-wrap gap-2 mt-5">${tabs}</div>${list.length ? `<div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">${list.map(predCard).join('')}</div>` : empty('No predictions in this category.')}`;
}
function viewRecord() {
  const { p, w, l, pe, wr } = predStats(), h = [...p].reverse().slice(0, 8);
  const tile = (v, t, c) => `<div class="panel text-center"><div class="disp text-4xl ${c}">${v}</div><div class="text-[11px] text-slate-400 uppercase tracking-widest">${t}</div></div>`;
  return title('Prediction Record', 'Calculated from published predictions with verified results. Void and pending picks are excluded from the win rate.') + `<div class="grid lg:grid-cols-3 gap-4"><div class="panel flex items-center gap-6"><div class="donut big" style="--p:${wr}"><span>${wr}%</span></div><div><div class="font-black">Win rate</div><div class="text-xs text-slate-400">${w} won · ${l} lost</div></div></div><div class="lg:col-span-2 grid grid-cols-2 md:grid-cols-4 gap-4">${tile(p.length, 'Total', '')}${tile(w, 'Won', 'text-emerald-400')}${tile(l, 'Lost', 'text-red-400')}${tile(pe, 'Pending', 'text-amber-300')}</div></div>` + (h.length ? `<h2 class="text-xl font-black mt-10 mb-4">Recent History</h2><div class="panel">${h.map(x => `<div class="flex items-center justify-between gap-3 py-3 border-b border-slate-800 text-sm"><div class="min-w-0"><div class="font-bold truncate">${esc(x.match)}</div><div class="text-[11px] text-slate-400">${esc(x.competition)} · ${esc(x.pick)}</div></div><div class="flex items-center gap-3 shrink-0"><span class="font-bold">${esc(x.score || '')}</span>${resBadge(x.result)}</div></div>`).join('')}</div>` : '');
}
const adminTiles = () => { const c = S.content, p = c.predictions || [], t = (v, l) => `<div class="panel text-center"><div class="disp text-4xl text-blue-400">${v}</div><div class="text-[11px] text-slate-400 uppercase tracking-widest">${l}</div></div>`; return `<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">${t(p.length, 'Predictions')}${t(p.filter(x => x.published !== 'false').length, 'Published')}${t((c.news || []).length, 'News')}${t((c.featured || []).length, 'Big matches')}</div>`; };

// ============ STANDINGS ============
async function loadStandings() {
  S.std = null; render();
  try { S.std = await api('/api/standings/' + S.comp); }
  catch (e) { S.std = { error: e.message }; }
  try { S.sc = (await api('/api/scorers/' + S.comp)).scorers; } catch (e) { S.sc = []; }
  if (S.view === 'standings') render();
}
function pickComp(c) { S.comp = c; loadStandings(); }

function viewStandings() {
  const chips = Object.entries(COMPS).map(([c, n]) =>
    `<button onclick="pickComp('${c}')" class="px-4 py-2 rounded-full text-xs font-bold border ${S.comp === c ? 'bg-blue-600 border-blue-500' : 'bg-slate-900 border-slate-700 text-slate-300'}">${n}</button>`).join('');
  let body = skel(2);
  if (S.std?.error) body = `<p class="text-red-400 text-sm mt-6">Failed to load standings: ${esc(S.std.error)}</p>`;
  else if (S.std?.standings) {
    const tables = S.std.standings.filter(s => s.type === 'TOTAL');
    body = tables.map(t => `<div class="mt-6 rounded-2xl bg-slate-900 border border-slate-800 overflow-x-auto">
      ${t.group ? `<div class="px-4 pt-4 text-xs font-bold text-blue-400">${esc(t.group.replace('_', ' '))}</div>` : ''}
      <table class="w-full text-sm"><thead><tr class="text-xs text-slate-400 text-center"><th class="p-3">#</th><th class="p-3 text-left">Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th class="pr-4">Pts</th></tr></thead><tbody>
      ${t.table.map(r => `<tr class="border-t border-slate-800 text-center"><td class="p-3 text-slate-400">${r.position}</td>
        <td class="p-3 text-left"><div class="flex items-center gap-2">${crest(r.team.crest)}<span class="font-semibold">${esc(r.team.shortName || r.team.name)}</span></div></td>
        <td>${r.playedGames}</td><td>${r.won}</td><td>${r.draw}</td><td>${r.lost}</td><td>${r.goalDifference > 0 ? '+' : ''}${r.goalDifference}</td><td class="pr-4 font-black text-blue-400">${r.points}</td></tr>`).join('')}
      </tbody></table></div>`).join('') || '<p class="text-slate-400 text-sm mt-6">Standings belum tersedia.</p>';
  }
  return `<h1 class="text-3xl font-black">Standings</h1><p class="text-xs text-slate-400 mb-4">Live from the football data feed.</p><div class="flex gap-2 flex-wrap">${chips}</div>${body}${scorers()}`;
}

// ============ ADMIN ============
const $0 = 0;
const $ = id => document.getElementById(id);
const $v = id => $(id).value;

// ============ RENDER & NAVIGASI ============
function render() {
  hook();
  setTimeout(() => { const qi = $('q'); if (S.fq && qi) { qi.focus(); qi.setSelectionRange(qi.value.length, qi.value.length); S.fq = 0; } }, 0);
  ['home','matches','standings','predictions','record','kits','admin'].forEach(v => {
    $('nav-' + v).className = 'px-3 py-2 navl ' + (S.view === v ? 'on' : '');
  });
  const V = { home: viewHome, matches: () => S.detailId ? viewDetail() : viewMatches(), standings: viewStandings, predictions: viewPredictions, record: viewRecord, kits: viewKits, admin: viewAdmin };
  $('app').innerHTML = V[S.view]();
}

window.onload = () => {
  applyRoute(); loadMatches(); loadContent();
  setInterval(loadMatches, 60000);
  setInterval(() => { if (S.view === 'matches' && S.detailId) loadDetail(); }, 30000);
};
</script>
</body>
